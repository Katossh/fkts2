services:
  xray:
    image: ghcr.io/xtls/xray-core:${XRAY_VERSION:-26.10.31}
    container_name: fkts2-xray
    network_mode: host
    restart: unless-stopped
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ./runtime/xray:/usr/local/etc/xray:ro
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/xray
        - run
        - -test
        - -confdir
        - /usr/local/etc/xray
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cloudflare-dns:
    profiles:
      - dns
    build:
      context: ./dns
    image: fkts2-cloudflare-dns:local
    container_name: fkts2-cloudflare-dns
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      CF_ZONE_NAME: ${CF_ZONE_NAME:-katossh.dpdns.org}
      CF_RECORD_NAME: ${CF_RECORD_NAME:-xray.katossh.dpdns.org}
      ENTRY_IP: ${ENTRY_IP:-}
