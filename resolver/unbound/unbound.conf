# fkts2 Unbound configuration.
# Unbound validates DNSSEC locally and forwards all external lookups only
# to the local dnscrypt-proxy DoH listener. There is deliberately no
# recursive/plaintext fallback when Cloudflare DoH is unavailable.

server:
    do-daemonize: no
    directory: "/var/unbound"
    # The container already runs as the dedicated unbound UID/GID.
    username: ""
    chroot: ""
    logfile: ""
    pidfile: ""
    verbosity: 1

    # Bind only to host loopback. No public DNS listener.
    interface: 127.0.0.1
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse

    # DNSSEC validation requires both the validator module and a trust anchor.
    module-config: "validator iterator"
    auto-trust-anchor-file: "/var/unbound/root.key"
    root-hints: "/var/unbound/root.hints"
    harden-glue: yes
    harden-dnssec-stripped: yes
    val-permissive-mode: no

    # The only forwarder is intentionally on loopback. Allow Unbound to
    # query localhost because dnscrypt-proxy listens on 127.0.0.1:5053.
    do-not-query-localhost: no

    edns-buffer-size: 1232
    prefetch: yes
    prefetch-key: yes
    num-threads: 1
    msg-cache-size: 32m
    rrset-cache-size: 64m
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800

    # Avoid exposing query-level details in normal logs.
    log-queries: no
    log-replies: no
    use-syslog: no

forward-zone:
    name: "."
    forward-addr: 127.0.0.1@5053
    forward-first: no
